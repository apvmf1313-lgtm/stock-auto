name: daily-report

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stock_auto
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock_auto/requirements.txt

      - run: pip install -r requirements.txt

      - name: 계산 로직 테스트
        run: python -m pytest -q

      - name: 리포트 생성
        run: python run_daily.py --out ../docs

      - name: 목록 페이지 생성
        run: python make_index.py ../docs

      - name: 리포트 커밋
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add ../docs
          git diff --cached --quiet || git commit -m "daily report $(date -u +%F)"
          git push

      - name: 텔레그램 알림(선택)
        working-directory: .
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python notify.py
